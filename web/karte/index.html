<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITEL__</title>
<meta name="description" content="Alle landwirtschaftlichen Flächen im Gebiet – ein Klick auf eine Fläche zeigt den ganzen Betrieb. __STAND__">
<meta property="og:title" content="__TITEL__">
<meta property="og:description" content="Alle Flächen anklicken: Betrieb, Hof, Kulturen. __STAND__">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2C5B45">
<meta name="fk-version" content="__VERSION__">
<meta name="fk-kacheln" content="__KACHELN__">
<!--__ROBOTS__-->
<!--__ONLINE__-->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css?v=__VERSION__">
</head>
<body>
<div id="map" aria-label="Karte"></div>

<aside id="side" data-state="half">
  <div id="grip" aria-hidden="true"><span></span></div>
  <header class="top">
    <div class="title">
      <h1>__TITEL__</h1>
      <span id="lock" class="lock" title="Interner Teil (Namen)"></span>
    </div>
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Suchen: Name, Betriebsnummer, Ort, Adresse">
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="liste" class="on" role="tab">Betriebe</button>
      <button data-tab="karte" role="tab">Karte</button>
      <button data-tab="info" role="tab">Info</button>
    </nav>
  </header>

  <section id="panels">
    <div id="p-liste" class="panel on">
      <div class="chips" id="filter">
        <button data-f="" class="on">Alle</button>
        <button data-f="gemuese">Gemüse</button>
        <button data-f="geschuetzt">Gewächshaus</button>
        <button data-f="bio">Bio</button>
      </div>
      <div id="fav-block"><h3>Favoriten</h3>
      <div id="favs"></div></div>
      <h3 id="liste-titel">Höfe im Kartenausschnitt</h3>
      <div id="liste"></div>
      <p id="liste-mehr" class="hint"></p>
    </div>

    <div id="p-karte" class="panel">
      <h3>Hintergrund</h3>
      <div class="seg" id="bg">
        <button data-bg="grau" class="on">Landeskarte grau</button>
        <button data-bg="farbe">Landeskarte</button>
        <button data-bg="luft">Luftbild</button>
      </div>
      <h3>Flächen färben</h3>
      <div class="seg" id="farbe">
        <button data-m="neutral" class="on">einheitlich</button>
        <button data-m="kultur">nach Kultur</button>
      </div>
      <label class="check"><input type="checkbox" id="favon"> Favoriten immer farbig zeigen</label>
      <label class="check"><input type="checkbox" id="parz"> Parzellen Kanton Zürich (ab Zoom 17)</label>
      <label class="check" id="adr-wahl" hidden><input type="checkbox" id="adr"> AdR-Regionen (Migros «Aus der Region»)
        <small>– bei einem Betrieb mit Anteil je Region</small></label>
      <div id="legende"></div>
    </div>

    <div id="p-info" class="panel">
      <div id="intern-box" class="box"></div>
      <div id="info-text"></div>
    </div>

    <div id="p-detail" class="panel" aria-live="polite"></div>
  </section>
</aside>

<div id="toast" role="status"></div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="app.js?v=__VERSION__"></script>
</body>
</html>
